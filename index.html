<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0060A9">
<meta name="color-scheme" content="only light">
<title>Inspeção Puma</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspeção Puma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme:only light;
  --pri:#0060A9; --pri2:#0079C1; --acc:#00A651;
  --bg:#F2F5F8; --card:#FFFFFF; --tx:#1A2330; --tx2:#5B6878; --bd:#D8DFE7;
  --in:#FFFFFF; --ok:#1E8E3E; --okbg:#E6F4EA; --warn:#C5221F; --warnbg:#FCE8E6; --pend:#8A96A3; --pendbg:#EEF1F4;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#0F151C; --card:#18212B; --tx:#E6EDF3; --tx2:#9AA8B6; --bd:#2A3643;
  --in:#101820; --okbg:#12311D; --warnbg:#3A1715; --pendbg:#222D38; --ok:#5BD07A; --warn:#FF7B72;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;line-height:1.2;flex:1}
header.top small{display:block;font-weight:400;opacity:.85;font-size:12px}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:0 0 12px;box-shadow:var(--shadow);overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary .ttl{flex:1}
.card>summary .ttl small{display:block;font-weight:400;color:var(--tx2);font-size:12.5px;margin-top:2px}
.card>summary::after{content:"▾";color:var(--tx2);transition:transform .2s}
.card[open]>summary::after{transform:rotate(180deg)}
.body{padding:0 16px 16px}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:18px 4px 8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--pri2);margin:18px 0 8px;border-bottom:1px solid var(--bd);padding-bottom:6px}
:root[data-theme="dark"] h3{color:#6CB6F0}
label{display:block;font-size:13px;color:var(--tx2);margin:0 0 4px}
.f{margin-bottom:10px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr 86px;gap:8px;align-items:end}
.delta{padding:10px 6px;border-radius:10px;text-align:center;font-weight:700;font-size:14px;background:var(--pendbg);color:var(--pend);min-height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.delta small{font-weight:500;font-size:10.5px;opacity:.85}
.delta.ok{background:var(--okbg);color:var(--ok)}
.delta.warn{background:var(--warnbg);color:var(--warn)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:11px 4px;border:0;background:var(--in);color:var(--tx);font-size:14px;cursor:pointer;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.seg button.on.bad{background:var(--warn)}
.seg button.on.good{background:var(--ok)}
.badge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-pend{background:var(--pendbg);color:var(--pend)}
.b-skip{background:var(--pendbg);color:var(--tx2)}
.issues{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.issues ul{margin:4px 0 0;padding-left:18px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--pendbg)}
.ph img{width:100%;height:96px;object-fit:cover;display:block}
.ph span{display:block;font-size:11px;padding:4px 6px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.phbtns{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.btn.sm{padding:8px 10px;font-size:13px}
.btn.has{border-color:var(--acc)}
.cnt{background:var(--acc);color:#fff;border-radius:10px;padding:1px 7px;font-size:11.5px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--warn)}
.hint{font-size:12.5px;color:var(--tx2);margin:4px 0 10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:10}
.bar .prog{flex:1;font-size:13px;color:var(--tx2)}
.bar .prog b{color:var(--tx)}
.pbar{height:6px;background:var(--pendbg);border-radius:4px;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);width:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90%}
.toast.show{opacity:1}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:4px;background:var(--pri);padding:0 12px 8px;position:sticky;top:64px;z-index:9}
.tabs button{flex:1;border:0;background:rgba(255,255,255,.14);color:#fff;padding:9px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri)}
.rng{font-size:12.5px;margin:-4px 0 10px;padding:6px 10px;border-radius:8px;background:var(--pendbg);color:var(--tx2)}
.rng b.ok{color:var(--ok)} .rng b.warn{color:var(--warn)}
.rngedit{border:0;background:none;color:var(--pri2);font-size:12.5px;font-weight:600;padding:2px 0 0;cursor:pointer;text-decoration:underline}
:root[data-theme="dark"] .rngedit{color:#6CB6F0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex!important;gap:8px;align-items:center;font-size:13.5px;color:var(--tx)!important;margin:2px 0 6px}
.chk input{width:18px;height:18px}
input.susp{border-color:#D08A00;background:#FFF6E0;color:#1A2330}
.vwarn{margin:4px 0 10px;padding:8px 10px;border-radius:10px;background:#FFF3D6;color:#7A4E00;font-size:13px;border:1px solid #F0C877}
.rng b.warn{color:var(--warn)}
.ac-it{border:1px solid var(--bd);border-left:4px solid #C98A00;border-radius:10px;padding:10px;margin-bottom:10px}
.ac-it.a{border-left-color:var(--warn)} .ac-it.f{border-left-color:var(--ok)}
.ac-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ac-h small{color:var(--tx2)}
.ac-oc{font-size:13.5px;color:var(--tx);margin-bottom:6px}
.b-med{background:#FFF1D6;color:#8A5A00}
.cm-row{display:grid;grid-template-columns:62px 1fr 42px 52px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.cm-bar{height:12px;background:var(--pendbg);border-radius:6px;overflow:hidden;display:block}
.cm-bar i{display:block;height:100%;border-radius:6px}
.cm-row small{color:var(--tx2);font-size:12px}
.tr-t{font-size:13px;font-weight:600;color:var(--tx);margin:12px 0 4px}
.hl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hl-row small{color:var(--tx2)}
.tabs button{padding:9px 4px;font-size:13.5px}
.card.flash{outline:3px solid var(--acc);outline-offset:2px;transition:outline .3s}
table.lim{width:100%;border-collapse:collapse;font-size:14px}
table.lim th{font-size:12px;color:var(--tx2);text-align:left;font-weight:600;padding:4px}
table.lim td{padding:4px}
table.lim td:first-child{white-space:nowrap;padding-right:8px}
table.lim input{padding:8px;text-align:center}
table.lim input:disabled{background:transparent;border-color:transparent;color:var(--tx);opacity:1;-webkit-text-fill-color:var(--tx);font-weight:600}
.lockbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.lockbar p{flex:1;margin:0}
#report{display:none}
#report,#report *{color-scheme:only light}

/* ===== RELATÓRIO (impressão / PDF) ===== */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#000;font-size:10.5pt}
  header.top,main,.bar,.toast,.tabs{display:none!important}
  #report{display:block}
  .r-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0060A9;padding-bottom:6px;margin-bottom:10px}
  .r-head h1{font-size:16pt;margin:0;color:#0060A9}
  .r-head div{font-size:9.5pt;text-align:right}
  .r-sec{font-size:11pt;color:#fff;background:#0060A9;padding:4px 8px;margin:14px 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.r{width:100%;border-collapse:collapse;font-size:8.8pt}
  table.r th,table.r td{border:1px solid #999;padding:3px 4px;text-align:center}
  table.r th{background:#E3ECF5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.r td.l{text-align:left;white-space:nowrap}
  table.r td.fx{color:#C5221F;font-weight:700;text-decoration:underline}
  .r-ok{color:#1E7E34;font-weight:700}
  .r-warn{color:#C5221F;font-weight:700}
  .r-pt{page-break-inside:avoid;border:1px solid #bbb;padding:6px 8px;margin-bottom:8px}
  .r-pt h4{margin:0 0 4px;font-size:10.5pt}
  .r-ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .r-ph figure{margin:0;width:31%;page-break-inside:avoid}
  .r-ph img{width:100%;max-height:60mm;object-fit:contain;border:1px solid #ccc}
  .r-ph figcaption{font-size:8pt;text-align:center}
  .r-sign{display:flex;gap:30px;margin-top:30px}
  #report{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .pb{page-break-before:always}
  .r-sub{font-size:8.5pt;color:#3D4A57;margin:-2px 0 6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
  .kpi{border:1px solid #C9D2DC;border-radius:8px;padding:8px 10px;background:#fff}
  .kpi small{display:block;font-size:8pt;color:#3D4A57;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kpi b{display:block;font-size:20pt;line-height:1.1;color:#1A2330}
  .kpi span{font-size:8.5pt;color:#5B6878}
  .kpi .ic{font-size:11pt;margin-right:4px}
  .ic-ok{color:#1E8E3E}.ic-warn{color:#C5221F}.ic-pend{color:#8A96A3}
  .mapa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
  .mt{border:1px solid #C9D2DC;color:#1A2330;border-left:4px solid #8A96A3;border-radius:6px;padding:5px 7px;font-size:8.3pt;line-height:1.25;background:#fff}
  .mt b{display:block;font-size:8.6pt;color:#1A2330}
  .mt.ok{border-left-color:#1E8E3E;background:#EAF6EE}.mt.warn{border-left-color:#C5221F;background:#FCEBE9}
  .mt .st{font-weight:700}.mt.ok .st{color:#1E8E3E}.mt.warn .st{color:#C5221F}.mt .st.n{color:#8A96A3}
  table.acao{width:100%;border-collapse:collapse;font-size:8.6pt}
  table.acao th{text-align:left;color:#5B6878;font-weight:600;font-size:8pt;border-bottom:1.5px solid #1A2330;padding:4px}
  table.acao td{border-bottom:1px solid #E3E8EE;padding:5px 4px;vertical-align:top}
  .prio{font-weight:700;font-size:7.8pt;padding:1px 6px;border-radius:8px;white-space:nowrap}
  .prio.a{background:#FCE8E6;color:#C5221F}.prio.m{background:#FFF4E0;color:#9A5B00}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pc{background:#fff;color:#1A2330;border:1px solid #C9D2DC;border-left:4px solid #8A96A3;border-radius:8px;padding:7px 9px;page-break-inside:avoid;break-inside:avoid}
  .pc.ok{border-left-color:#1E8E3E}.pc.warn{border-left-color:#C5221F}
  .pc h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px;font-size:9.8pt}
  .pill{font-size:7.6pt;font-weight:700;padding:2px 7px;border-radius:9px}
  .pill.ok{background:#E6F4EA;color:#1E8E3E}.pill.warn{background:#FCE8E6;color:#C5221F}.pill.pend,.pill.skip{background:#EEF1F4;color:#5B6878}
  .rg{display:grid;grid-template-columns:17mm 1fr 30mm;gap:6px;align-items:center;margin:1px 0}
  .rg .nm{font-size:8.3pt;color:#1A2330;font-weight:600;line-height:1.1}
  .rg .nm small{display:block;font-size:6.8pt}
  .rg .vl{font-size:7.8pt;color:#1A2330;line-height:1.25;font-variant-numeric:tabular-nums}
  .rg .vl .d{color:#3D4A57}.rg .vl .d.w{color:#C5221F;font-weight:700}
  .rg svg{width:100%;height:auto;display:block}
  .dos{font-size:8pt;color:#3D4A57;border-top:1px dashed #D8DFE7;margin-top:4px;padding-top:3px}
  .dos b{color:#1A2330;font-weight:600}.dos .w{color:#C5221F;font-weight:700}
  .leg{display:flex;gap:14px;font-size:8.3pt;color:#1A2330;margin:0 0 6px;align-items:center}
  .leg svg{vertical-align:middle}
  .prio.f{background:#E6F4EA;color:#1E8E3E}
  .cm1{font-size:9pt;color:#1A2330;margin:-4px 0 10px;padding:6px 10px;border:1px solid #C9D2DC;border-radius:8px;background:#fff}
  .cm1 .bar{display:inline-block;vertical-align:middle;width:120px;height:8px;background:#E1E6EC;border-radius:4px;overflow:hidden;margin:0 6px}
  .cm1 .bar i{display:block;height:100%}
  table.tm{width:100%;border-collapse:collapse;font-size:8.4pt}
  table.tm th{text-align:left;color:#3D4A57;font-size:8pt;font-weight:600;border-bottom:1.5px solid #1A2330;padding:3px 4px}
  table.tm td{border-bottom:1px solid #E3E8EE;padding:3px 4px;vertical-align:middle}
  table.tm td.n{font-weight:600;white-space:nowrap;width:30mm}
  table.tm svg{width:100%;height:auto;display:block}
  .atr{color:#C5221F;font-weight:700}
  .r-sign div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:9pt}
}
</style>
</head>
<body>

<header class="top">
  <h1>Inspeção Ecolab · Nalco<small>Klabin Puma · Trasar / Caldeiras</small></h1>
  <button class="iconbtn" id="themeBtn" title="Modo escuro">◐</button>
</header>
<nav class="tabs"><button type="button" data-view="insp" class="on">📋 Inspeção</button><button type="button" data-view="hist">📈 Histórico</button><button type="button" data-view="lim">📏 Limites</button></nav>
<input type="file" id="bkIn" accept=".json,application/json" style="display:none">

<main id="app"></main>

<div class="bar">
  <div class="prog"><b id="progTxt">0/0</b> pontos inspecionados<div class="pbar"><i id="progBar"></i></div></div>
  <button class="btn pri" id="pdfBtn">📄 Gerar PDF</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">
<div id="report"></div>

<script>
(function(){
"use strict";

/* ================= CONFIGURAÇÃO ================= */
var PONTOS = [
  {id:"da1",   nome:"Trasar Desaerador 1", grupo:"Desaeradores"},
  {id:"da2",   nome:"Trasar Desaerador 2", grupo:"Desaeradores"},
  {id:"cdf1d", nome:"CDF1 – Descarga",     grupo:"Caldeira CDF1",          dose:true},
  {id:"cdf2a", nome:"CDF2 – Alimentação",  grupo:"Caldeira CDF2",          dose:true},
  {id:"cdf2d", nome:"CDF2 – Descarga",     grupo:"Caldeira CDF2",          dose:true},
  {id:"cdr1a", nome:"CDR1 – Alimentação",  grupo:"Caldeira CDR1 (Balão)",  dose:true},
  {id:"cdr1d", nome:"CDR1 – Descarga",     grupo:"Caldeira CDR1 (Balão)",  dose:true},
  {id:"cdr2a", nome:"CDR2 – Alimentação",  grupo:"Caldeira CDR2 (3461 REC2)", dose:true},
  {id:"cdr2d", nome:"CDR2 – Descarga",     grupo:"Caldeira CDR2 (3461 REC2)", dose:true},
  {id:"wsa",   nome:"Trasar WSA",          grupo:"Caldeira Ácido WSA",     dose:true}
];
var PRODUTOS = ["Amina","Fosfato"];

/* Faixas de controle padrão (preencher com os valores oficiais da Puma).
   Formato: "min","max" como texto; vazio = sem limite. */
var PARAMS = [
  {k:"ph",   nome:"pH",                      un:"",      casas:2},
  {k:"cond", nome:"Condutividade",           un:"µS/cm", casas:0},
  {k:"fos",  nome:"TRASAR Dose (tinta)",     un:"ppm",   casas:1, flag:"dose"}
];
function aplica(q,pt){ return !q.flag || !!pt[q.flag]; }
/* Fonte: Nalco Water Quality IQ – System Performance by Parameter (23/09/2026) */
var LIMITES_PADRAO = {
  da1:  {phMin:"9,2", phMax:"9,8", condMin:"3", condMax:"10"},
  da2:  {phMin:"9,2", phMax:"9,8", condMin:"3", condMax:"10"},
  cdf1d:{phMin:"9,3", phMax:"9,7", condMin:"5", condMax:"30", fosMin:"25", fosMax:"75"},
  cdf2a:{phMin:"9,3", phMax:"9,7", condMin:"8", condMax:"30", fosMin:"25", fosMax:"75"},
  cdf2d:{phMin:"9,3", phMax:"9,7", condMin:"8", condMax:"30", fosMin:"25", fosMax:"75"},
  cdr1a:{phMin:"9,3", phMax:"9,7", condMin:"5", condMax:"30", fosMin:"25", fosMax:"75"},
  cdr1d:{phMin:"9,3", phMax:"9,7", condMin:"5", condMax:"30", fosMin:"25", fosMax:"75"},
  cdr2a:{phMin:"9,3", phMax:"9,7", condMin:"6", condMax:"80", fosMin:"40", fosMax:"75"},
  cdr2d:{phMin:"9,3", phMax:"9,7", condMin:"6", condMax:"80", fosMin:"40", fosMax:"75"},
  wsa:  {phMin:"9,2", phMax:"9,8", condMin:"3", condMax:"30", fosMin:"25", fosMax:"75"}
};
var LIM_REF_PADRAO = "Limites do Nalco Water Quality IQ (System Performance by Parameter), consultados em 23/09/2026.";
var LIM_KEY = "puma_limites_v2";
var KEY = "puma_inspecao_v1";
var THEME_KEY = "puma_theme";

/* ================= ESTADO ================= */
function hoje(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function novoEstado(inspetor){
  var s = {
    cab:{data:hoje(), inspetor:inspetor||"", obs:""},
    cfg:{tolPh:0.3, tolCond:10, tolPO4:0.5, fatorPO4:25.84, tolBufPh:0.1, tolPadrao:5, autMin:7},
    acoes:{}, follow:{},
    med:{modelo:"", serie:"", calib:"", buf1:"7,00", buf1L:"", buf2:"4,01", buf2L:"", padrao:"1413", padraoL:"", bateria:"", eletrodo:"", obs:"", fotos:[]},
    pts:{}
  };
  PONTOS.forEach(function(p){

/* consumo do tanque comparando com a última inspeção que registrou nível */
function consumo(id){
  var p=S.pts[id], n=num(p.nivel); if(n==null||p.skip) return null;
  var hs=histAntes(), prev=null;
  for(var i=hs.length-1;i>=0;i--){ var q=hs[i].pts[id]; if(q&&!q.skip&&num(q.nivel)!=null){ prev={data:hs[i].data,n:num(q.nivel)}; break; } }
  if(!prev) return {semRef:true};
  var dias=diasEntre(prev.data,S.cab.data||hoje()); if(dias<1) return {semRef:true};
  var c=(prev.n+(num(p.abast)||0)-n)/dias;
  if(c<=0.05) return {prev:prev,dias:dias,c:0,aut:null,semConsumo:true};
  return {prev:prev,dias:dias,c:c,aut:n/c};
}
function consumoTxt(cs){
  if(!cs) return ""; if(cs.semRef) return "Consumo: sem inspeção anterior com nível para comparar";
  if(cs.semConsumo) return "Sem consumo mensurável desde "+dataBR(cs.prev.data)+" (confira se houve abastecimento)";
  return "Consumo ≈ "+fmt(cs.c,1)+" L/dia desde "+dataBR(cs.prev.data)+" ("+cs.dias+" d) · autonomia ≈ "+fmt(cs.aut,0)+" dias";
}

function idbTx(mode,fn){ return idb().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction("fotos",mode), st=tx.objectStore("fotos"), out=fn(st); tx.oncomplete=function(){ res(out&&out.result!==undefined?out.result:out); }; tx.onerror=function(){ rej(tx.error); }; }); }); }
function idbPut(id,d){ return idbTx("readwrite",function(st){ st.put(d,id); }).catch(function(){ toast("⚠️ Não foi possível salvar a foto no aparelho",4000); }); }

function idbLoadAll(){ return idb().then(function(db){ return new Promise(function(res){ var out={}, tx=db.transaction("fotos","readonly"), c=tx.objectStore("fotos").openCursor();
  c.onsuccess=function(){ var cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; tx.oncomplete=function(){ res(out); }; tx.onerror=function(){ res(out); }; }); }); }

function cmpPh(a,b){ var x=num(a),y=num(b); if(x==null||y==null) return null; var d=Math.abs(x-y); return {d:d, ok:d<=S.cfg.tolPh}; }
/* TRASAR mostra residual de tinta (ppm produto); PO4 = tinta ÷ fator (padrão 25,84) */
function fator(){ var f=+S.cfg.fatorPO4; return f>0?f:25.84; }
function po4Calc(p){ var d=num(p.fosT); return d==null?null:d/fator(); }
function cmpFos(p){ var x=po4Calc(p),y=num(p.fosP); if(x==null||y==null) return null; var d=Math.abs(x-y); return {d:d, ok:d<=S.cfg.tolPO4}; }
function faixaPO4(id,val){ var v=num(val), lo=num(L[id].fosMin), hi=num(L[id].fosMax);
  if(v==null||(lo==null&&hi==null)) return null; if(lo!=null&&v<lo/fator()) return "baixo"; if(hi!=null&&v>hi/fator()) return "alto"; return "ok"; }
function faixaPO4Txt(id){ var lo=num(L[id].fosMin), hi=num(L[id].fosMax), f=fator();
  if(lo==null&&hi==null) return ""; if(lo!=null&&hi!=null) return fmt(lo/f,2)+" – "+fmt(hi/f,2); return lo!=null?"≥ "+fmt(lo/f,2):"≤ "+fmt(hi/f,2); }
/* faixa: retorna null (sem limite/valor), "ok", "baixo" ou "alto" */
function faixa(id,k,val){
  var v=num(val), lo=num(L[id][k+"Min"]), hi=num(L[id][k+"Max"]);
  if(v==null||(lo==null&&hi==null)) return null;
  if(lo!=null&&v<lo) return "baixo"; if(hi!=null&&v>hi) return "alto"; return "ok";
}
function faixaTxt(id,k,casas){
  var lo=num(L[id][k+"Min"]), hi=num(L[id][k+"Max"]);
  if(lo==null&&hi==null) return "";
  if(lo!=null&&hi!=null) return fmt(lo,casas)+" – "+fmt(hi,casas);
  return lo!=null?"≥ "+fmt(lo,casas):"≤ "+fmt(hi,casas);
}
var FONTES={ph:[["phT","Trasar"],["phP","Portátil"]], cond:[["condT","Trasar"],["condP","Portátil"]], fos:[["fosT","Trasar"]]};
function cmpCond(a,b){ var x=num(a),y=num(b); if(x==null||y==null||y===0) return null; var d=Math.abs(x-y)/y*100; return {d:d, ok:d<=S.cfg.tolCond}; }

function avaliaPonto(id){
  var p=S.pts[id], issues=[], filled=false;
  if(p.skip) return {st:"skip", issues:[]};
  ["phT","phP","condT","condP","fosT","fosP","produto","dosagem","vazao","pressao","nivel","abast","vazamento","ajuste"].forEach(function(k){ if(p[k]!=="" && p[k]!=null) filled=true; });
  if(p.fotos.length) filled=true;
  var ph=cmpPh(p.phT,p.phP); if(ph && !ph.ok) issues.push("Diferença de pH Trasar × portátil = "+fmt(ph.d,2)+" (limite "+fmt(S.cfg.tolPh,2)+")");
  var cd=cmpCond(p.condT,p.condP); if(cd && !cd.ok) issues.push("Diferença de condutividade = "+fmt(cd.d,1)+"% (limite "+fmt(S.cfg.tolCond,0)+"%)");
  var fo=cmpFos(p); if(fo && !fo.ok) issues.push("Diferença de PO₄ Trasar (calc. "+fmt(po4Calc(p),2)+") × laboratório ("+p.fosP+") = "+fmt(fo.d,2)+" ppm (limite "+fmt(S.cfg.tolPO4,2)+" ppm)");
  var rl=faixaPO4(id,p.fosP); if(rl==="alto"||rl==="baixo") issues.push("PO₄ Laboratório "+p.fosP+" ppm "+(rl==="alto"?"ACIMA":"ABAIXO")+" da faixa ("+faixaPO4Txt(id)+" ppm)");
  var pt=PONTOS.filter(function(x){return x.id===id;})[0];
  PARAMS.forEach(function(q){ if(!aplica(q,pt)) return;
    FONTES[q.k].forEach(function(f){ var r=faixa(id,q.k,p[f[0]]);
      if(r==="baixo"||r==="alto") issues.push(q.nome+" "+f[1]+" "+p[f[0]]+(q.un?" "+q.un:"")+" "+(r==="alto"?"ACIMA":"ABAIXO")+" da faixa ("+faixaTxt(id,q.k,q.casas)+")"); }); });
  if(p.dosagem==="parada") issues.push("Dosagem parada");
  if(p.vazamento==="sim") issues.push("Vazamento identificado"+(p.vazDesc?": "+p.vazDesc:""));
  var cs=consumo(id); if(cs&&cs.aut!=null&&cs.aut<S.cfg.autMin) issues.push("Autonomia do tanque ≈ "+fmt(cs.aut,0)+" dias (alerta abaixo de "+S.cfg.autMin+" dias)");
  if(!filled) return {st:"pend", issues:[]};
  return {st:issues.length?"warn":"ok", issues:issues};
}
function avaliaMedidor(){
  var m=S.med, issues=[];
  var b1=num(m.buf1),l1=num(m.buf1L),b2=num(m.buf2),l2=num(m.buf2L),pd=num(m.padrao),pl=num(m.padraoL);
  if(b1!=null&&l1!=null&&Math.abs(b1-l1)>S.cfg.tolBufPh) issues.push("Tampão pH "+fmt(b1,2)+" lido "+fmt(l1,2));
  if(b2!=null&&l2!=null&&Math.abs(b2-l2)>S.cfg.tolBufPh) issues.push("Tampão pH "+fmt(b2,2)+" lido "+fmt(l2,2));
  if(pd&&pl!=null&&Math.abs(pl-pd)/pd*100>S.cfg.tolPadrao) issues.push("Padrão de condutividade fora ("+fmt(Math.abs(pl-pd)/pd*100,1)+"%)");
  if(m.bateria==="baixa") issues.push("Bateria baixa");
  if(m.eletrodo==="ruim") issues.push("Eletrodo com problema");
  var filled = [m.buf1L,m.buf2L,m.padraoL,m.bateria,m.eletrodo].some(function(v){return v!=="";});
  return {st: !filled?"pend":(issues.length?"warn":"ok"), issues:issues};
}

function renderPlano(){

  $("#planoSub").textContent=pa.length?pa.filter(function(x){return !x.feito;}).length+" ação(ões) · "+pa.filter(function(x){return x.feito;}).length+" realizada(s) em campo":"Nenhuma ocorrência até agora";
  if(!pa.length){ el.innerHTML='<p class="hint">As ocorrências aparecem aqui automaticamente conforme você preenche os pontos.</p>'; return; }
  h+='<p class="hint">Ação sugerida pelo app — edite o texto, o responsável e o prazo se precisar.</p>';
  pa.forEach(function(x){
    h+='<div class="ac-it'+(x.pr==="a"?" a":"")+(x.feito?" f":"")+'"><div class="ac-h"><b>'+esc(x.pt)+'</b><span class="badge '+(x.feito?"b-ok":x.pr==="a"?"b-warn":"b-med")+'">'+(x.feito?"✔ Realizado":x.pr==="a"?"Alta":"Média")+'</span></div>'

function renderHist(){

  // conformidade mensal
  var cm=conformMensal(false);
  h+='<div class="grp">Conformidade mensal</div><div class="card"><div class="body" style="padding-top:12px">';
  cm.slice(-6).forEach(function(m){ var pc=m.pct==null?0:m.pct;
    h+='<div class="cm-row"><span class="cm-m">'+m.rot+'</span><span class="cm-bar"><i style="width:'+pc.toFixed(0)+'%;background:'+(pc>=90?'var(--ok)':pc>=70?'#C98A00':'var(--warn)')+'"></i></span><b>'+(m.pct==null?'–':fmt(m.pct,0)+'%')+'</b><small>'+m.n+' insp.</small></div>'; });
  h+='<p class="hint" style="margin-top:8px">% de pontos conformes entre os pontos inspecionados no mês.</p></div></div>';

  h+='<div class="grp">Tendência por ponto</div><div class="card"><div class="body" style="padding-top:12px"><div class="f"><select id="histPtSel">'
    +PONTOS.map(function(x){ return '<option value="'+x.id+'"'+(x.id===pt.id?' selected':'')+'>'+esc(x.nome)+'</option>'; }).join("")+'</select></div>';
  PARAMS.forEach(function(q){ if(!aplica(q,pt)) return; var k=q.k, lt=limTrend(pt.id,k), sr=serieTrend(pt.id,k,false);
    h+='<div class="tr-t">'+(k==="fos"?"PO₄ (calculado da tinta) · ppm":q.nome+(q.un?" · "+q.un:""))+'</div>'+trendSVG(sr,lt[0],lt[1],k==="cond"?1:2,340,110); });
  var cons=hs.filter(function(e){ return e.pts[pt.id]&&e.pts[pt.id].cons!=null; }).slice(-10).map(function(e){ return {data:e.data,v:e.pts[pt.id].cons}; });
  if(cons.length>=2){ h+='<div class="tr-t">Consumo do tanque · L/dia</div>'+trendSVG(cons,null,null,1,340,110); }
  h+='<p class="hint">Linha azul = leitura do Trasar em cada inspeção · faixa verde = faixa de controle atual · ponto vermelho = fora da faixa.</p></div></div>';
  // lista
  h+='<div class="grp">Inspeções salvas ('+hs.length+')</div><div class="card"><div class="body" style="padding-top:8px">';
  hs.slice().reverse().forEach(function(e){ var c={ok:0,warn:0,skip:0}; PONTOS.forEach(function(x){ var q=e.pts[x.id]; if(q&&c[q.st]!=null) c[q.st]++; });
    h+='<div class="hl-row"><div><b>'+dataBR(e.data)+'</b> <small>'+esc(e.inspetor||"")+'</small><br><span class="badge b-ok">✔ '+c.ok+'</span> <span class="badge b-warn">⚠ '+c.warn+'</span>'+(c.skip?' <span class="badge b-skip">— '+c.skip+'</span>':'')+'</div>'
      +'<button type="button" class="btn sm danger" data-delhist="'+e.id+'">🗑</button></div>'; });
  h+='<div class="acts" style="margin-top:12px"><button type="button" class="btn" id="csvBtn">⬇️ Exportar histórico (Excel/CSV)</button></div></div></div>';
  // ações abertas
  if(A.length){ h+='<div class="grp">Ações em aberto ('+A.length+')</div><div class="card"><div class="body" style="padding-top:8px">';
    A.forEach(function(a){ var si=situacaoAcao(a); h+='<div class="hl-row"><div><b>'+esc(a.pt)+'</b> <small>desde '+dataBR(a.origem)+'</small><br>'+esc(a.acao)+' · '+esc(a.resp||"")+(a.prazo?' · até '+dataBR(a.prazo):'')+(si.atras?' <span class="badge b-warn">Atrasada</span>':'')+'</div></div>'; });

}

/* ================= ATUALIZAÇÕES PARCIAIS ================= */
function setDelta(el,res,casas,suf){
  if(!el) return;
  el.className="delta"+(res?(res.ok?" ok":" warn"):"");
  el.innerHTML=res?("Δ "+fmt(res.d,casas)+(suf||"")+"<small>"+(res.ok?"OK":"fora")+"</small>"):"–";
}
function atualizaPonto(id){
  var p=S.pts[id];
  setDelta($("#d-ph-"+id),cmpPh(p.phT,p.phP),2);
  setDelta($("#d-cd-"+id),cmpCond(p.condT,p.condP),1,"%");
  setDelta($("#d-fo-"+id),cmpFos(p),2);
  PARAMS.forEach(function(q){
    var el=$("#rg-"+q.k+"-"+id); if(!el) return;
    var ft=faixaTxt(id,q.k,q.casas);
    var eb='<button type="button" class="rngedit" data-editlim="'+id+'" data-lk="'+q.k+'">✏️ editar faixa</button>';
    if(!ft){ el.innerHTML='Faixa de controle não cadastrada '+eb; return; }
    var parts=FONTES[q.k].map(function(f){ var r=faixa(id,q.k,p[f[0]]); if(!r) return "";
      return f[1]+' <b class="'+(r==="ok"?"ok":"warn")+'">'+(r==="ok"?"✔ na faixa":(r==="alto"?"▲ acima":"▼ abaixo"))+'</b>'; }).filter(Boolean);
    el.innerHTML='Faixa: <b>'+ft+(q.un?' '+q.un:'')+'</b>'+(parts.length?' · '+parts.join(' · '):'');
    if(q.k==="fos"){
      var pc=po4Calc(p), rl=faixaPO4(id,p.fosP);
      el.innerHTML='Faixa tinta: <b>'+ft+' ppm</b> → PO₄ <b>'+faixaPO4Txt(id)+' ppm</b>'
        +(pc!=null?'<br>PO₄ Trasar = '+esc(p.fosT)+' ÷ '+fmt(fator(),2)+' = <b>'+fmt(pc,2)+' ppm</b>'+(parts.length?' · '+parts.join(' · '):''):'')
        +(rl?'<br>PO₄ Laboratório <b class="'+(rl==="ok"?"ok":"warn")+'">'+(rl==="ok"?"✔ na faixa":(rl==="alto"?"▲ acima":"▼ abaixo"))+'</b>':'');
    }
    el.innerHTML+=' '+eb;
  });
  var sus=suspeitos(id), susK={}; sus.forEach(function(x){ susK[x[0]]=1; });
  Object.keys(LIMFIS).forEach(function(k){ var ie=$('[data-k="pts.'+id+'.'+k+'"]'); if(ie) ie.classList.toggle("susp",!!susK[k]); });
  var ve=$("#vl-"+id); if(ve) ve.innerHTML=sus.length?'<div class="vwarn">⚠ Confira: '+sus.map(function(x){return esc(x[1]);}).join("<br>⚠ Confira: ")+'</div>':"";
  var ce=$("#cs-"+id); if(ce){ var cs=consumo(id); ce.style.display=cs?"":"none";
    if(cs){ var baixo=cs.aut!=null&&cs.aut<S.cfg.autMin; ce.innerHTML=(baixo?'<b class="warn">⚠ ':'')+esc(consumoTxt(cs))+(baixo?'</b>':''); } }
  var r=avaliaPonto(id);
  $("#bd-"+id).innerHTML=badge(r.st);
  var sub=[]; if(p.produto) sub.push(p.produto); if(p.phP) sub.push("pH "+p.phP); if(p.condP) sub.push(p.condP+" µS/cm");
  $("#sub-"+id).textContent=sub.join(" · ");
  $("#is-"+id).innerHTML=r.issues.length?'<div class="issues"><b>Pontos de atenção</b><ul>'+r.issues.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>':"";
}
function atualizaMedidor(){
  var m=S.med;
  function c(a,b,tol,pct){ var x=num(a),y=num(b); if(x==null||y==null) return null; var d=pct?Math.abs(y-x)/x*100:Math.abs(y-x); return {d:d,ok:d<=tol}; }
  setDelta($("#d-b1"),c(m.buf1,m.buf1L,S.cfg.tolBufPh),2);
  setDelta($("#d-b2"),c(m.buf2,m.buf2L,S.cfg.tolBufPh),2);
  setDelta($("#d-pd"),num(m.padrao)?c(m.padrao,m.padraoL,S.cfg.tolPadrao,1):null,1,"%");
  var r=avaliaMedidor();
  $("#bd-med").innerHTML=badge(r.st);
  $("#is-med").innerHTML=r.issues.length?'<div class="issues"><b>Medidor com pendência — resultados de campo podem não ser confiáveis</b><ul>'+r.issues.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>':"";
}
function atualizaProgresso(){
  var tot=PONTOS.length, feitos=0;
  PONTOS.forEach(function(p){ var st=avaliaPonto(p.id).st; if(st!=="pend") feitos++; });
  $("#progTxt").textContent=feitos+"/"+tot;
  $("#progBar").style.width=(feitos/tot*100)+"%";
  $("#cabSub").textContent=[dataBR(S.cab.data),S.cab.inspetor].filter(Boolean).join(" · ");
}
function atualizaTudo(){ PONTOS.forEach(function(p){atualizaPonto(p.id);}); atualizaMedidor(); atualizaProgresso(); }
function atualizaPor(path){
  var ks=path.split(".");
  if(ks[0]==="pts"){ atualizaPonto(ks[1]); var cp=$("#card-plano"); if(cp&&cp.open&&!cp.contains(document.activeElement)) renderPlano(); else if(cp) $("#planoSub").textContent=planoAcao().length+" ocorrência(s) — toque para revisar"; }
  else if(ks[0]==="med") atualizaMedidor();
  else if(ks[0]==="cfg"){ atualizaTudo(); renderPlano(); }
  atualizaProgresso();
}

/* ================= EVENTOS ================= */
var app=$("#app");
app.addEventListener("input",function(e){
  var lk=e.target.getAttribute("data-lim");
  if(lk){ if(lk==="_ref") L._ref=e.target.value; else { var a=lk.split("."); L[a[0]][a[1]]=e.target.value.trim(); } saveLim(); return; }
  var ak=e.target.getAttribute("data-ac");
  if(ak){ var ps=ak.split("|"); acaoSet(ps[0],ps[1],e.target.value); return; }
  var k=e.target.getAttribute("data-k"); if(!k) return;
  var v=e.target.value;
  if(k.indexOf("cfg.")===0){ var n=num(v); if(n==null) return; v=n; }
  setPath(k,v); save(); atualizaPor(k);
});
app.addEventListener("change",function(e){
  if(e.target.id==="histPtSel"){ histPt=e.target.value; renderHist(); return; }
  var lc=e.target.getAttribute("data-limchk");
  if(lc){ var q=lc.split("."); L[q[0]][q[1]]=e.target.checked; saveLim(); return; }
  var k=e.target.getAttribute("data-chk"); if(!k) return;
  setPath(k,e.target.checked); save();
  var id=k.split(".")[1]; $("#wrap-"+id).style.display=e.target.checked?"none":"";
  atualizaPor(k);
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var sg=b.parentNode.getAttribute&&b.parentNode.getAttribute("data-seg");
  if(sg){
    var v=b.getAttribute("data-v"), cur=getPath(sg), nv=(cur===v?"":v);
    setPath(sg,nv); save();
    Array.prototype.forEach.call(b.parentNode.children,function(x){ x.classList.toggle("on",x.getAttribute("data-v")===nv); });
    if(/\.vazamento$/.test(sg)){ var id=sg.split(".")[1]; $("#vd-"+id).style.display=nv==="sim"?"":"none"; }
    if(/\.ajuste$/.test(sg)){ var ida=sg.split(".")[1]; $("#aj-"+ida).style.display=nv==="sim"?"":"none"; }
    atualizaPor(sg); return;
  }

/* ---------- régua de faixa (SVG) ---------- */
var INK="#1A2330", MUTED="#5B6878", RED="#C5221F";
function regua(lo,hi,vals){
  var W=300,H=32,x0=6,x1=W-6, pts=vals.filter(function(o){return o.v!=null;});
  if(lo==null&&hi==null) return '<svg viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="17" text-anchor="middle" font-size="9" fill="'+MUTED+'">faixa não cadastrada</text></svg>';
  var a=lo!=null?lo:hi, b=hi!=null?hi:lo, span=(b-a)||Math.abs(a)*0.2||1;
  var dmin=a-span*0.6, dmax=b+span*0.6;
  pts.forEach(function(o){ if(o.v<dmin) dmin=o.v-span*0.15; if(o.v>dmax) dmax=o.v+span*0.15; });
  function X(v){ return x0+(v-dmin)/(dmax-dmin)*(x1-x0); }
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  g+='<rect x="'+x0+'" y="7" width="'+(x1-x0)+'" height="10" rx="5" fill="#E1E6EC"/>';
  var bx=X(lo!=null?lo:dmin), ex=X(hi!=null?hi:dmax);
  g+='<rect x="'+bx+'" y="7" width="'+Math.max(ex-bx,2)+'" height="10" rx="2" fill="#BFE3CB" stroke="#3E9A60" stroke-width="1.2"/>';
  if(lo!=null) g+='<text x="'+bx+'" y="28" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3D4A57">'+fmtN(lo)+'</text>';
  if(hi!=null) g+='<text x="'+ex+'" y="28" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3D4A57">'+fmtN(hi)+'</text>';
  pts.forEach(function(o){
    var out=(lo!=null&&o.v<lo)||(hi!=null&&o.v>hi), c=out?RED:INK, x=X(o.v);
    if(o.s==="c") g+='<circle cx="'+x+'" cy="12" r="5" fill="'+c+'" stroke="#fff" stroke-width="1.5"/>';
    else g+='<path d="M'+x+' 5.5 L'+(x+5.8)+' 16 L'+(x-5.8)+' 16 Z" fill="'+c+'" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>';
  });
  return g+'</svg>';
}
function fmtN(n){ var d=Math.abs(n)<10&&n%1!==0?2:(n%1!==0?1:0); return fmt(n,d); }
function linhaRegua(nome,un,lo,hi,a,b,rot,delta){

function planoAcao(){

    L2.push({key:key,pt:pt,oc:oc,sug:ac,acao:feito?ac:(o.acao||ac),resp:o.resp||resp,prazo:o.prazo||"",pr:pr,feito:!!feito}); }

  PONTOS.forEach(function(pt){
    var p=S.pts[pt.id], id=pt.id; if(p.skip) return;
    ["ph","cond"].forEach(function(k){
      var nome=k==="ph"?"pH":"Condutividade", un=k==="ph"?"":" µS/cm";
      var fora=[], dir="";
      FONTES[k].forEach(function(f){ var r=faixa(id,k,p[f[0]]); if(r==="alto"||r==="baixo"){ fora.push(f[1]+" "+p[f[0]]); dir=dir&&dir!==r?"fora":r; } });
      if(fora.length) add(id+":"+k,pt.nome,nome+" "+(dir==="alto"?"acima":dir==="baixo"?"abaixo":"fora")+" da faixa ("+faixaTxt(id,k,2)+un+"): "+fora.join(" · "),
          k==="ph"?"Verificar dosagem de amina/fosfato e purga; acompanhar tendência no Trasar":"Verificar purga/descarga e qualidade da água de alimentação","a",k==="ph"?"Ecolab":"Klabin");
    });
    if(pt.dose){ var r=faixa(id,"fos",p.fosT); if(r==="alto"||r==="baixo") add(id+":fos",pt.nome,"TRASAR Dose "+p.fosT+" ppm "+(r==="alto"?"acima":"abaixo")+" da faixa","Ajustar vazão da bomba de fosfato","a","Ecolab");
      var rl=faixaPO4(id,p.fosP); if(rl==="alto"||rl==="baixo") add(id+":po4lab",pt.nome,"PO₄ laboratório "+p.fosP+" ppm "+(rl==="alto"?"acima":"abaixo")+" da faixa","Confirmar análise e ajustar dosagem","a","Ecolab");
      var fo=cmpFos(p); if(fo&&!fo.ok) add(id+":dpo4",pt.nome,"PO₄ Trasar × laboratório Δ "+fmt(fo.d,2)+" ppm","Verificar calibração do Trasar e coleta da amostra","m","Ecolab"); }
    var aj=p.ajuste==="sim";
    var a=cmpPh(p.phT,p.phP); if(a&&!a.ok){ if(aj&&(p.ajPhA||p.ajPhD)) add(id+":dph",pt.nome,"pH Trasar × portátil Δ "+fmt(a.d,2),"Sonda de pH recalibrada em campo ("+(p.ajPhA||"?")+" → "+(p.ajPhD||"?")+")","m","Ecolab",true);
      else add(id+":dph",pt.nome,"pH Trasar × portátil Δ "+fmt(a.d,2),"Verificar sonda de pH do Trasar (limpeza/calibração)","m","Ecolab"); }
    var c=cmpCond(p.condT,p.condP); if(c&&!c.ok){ if(aj&&(p.ajCondA||p.ajCondD)) add(id+":dcond",pt.nome,"Condutividade Trasar × portátil Δ "+fmt(c.d,1)+"%","Sonda de condutividade recalibrada em campo ("+(p.ajCondA||"?")+" → "+(p.ajCondD||"?")+")","m","Ecolab",true);
      else add(id+":dcond",pt.nome,"Condutividade Trasar × portátil Δ "+fmt(c.d,1)+"%","Verificar sonda de condutividade do Trasar","m","Ecolab"); }
    if(p.dosagem==="parada") add(id+":dos",pt.nome,"Dosagem parada","Verificar bomba dosadora e restabelecer dosagem","a","Ecolab");
    if(p.vazamento==="sim") add(id+":vaz",pt.nome,"Vazamento"+(p.vazDesc?": "+p.vazDesc:""),"Reparar e registrar ordem de manutenção","a","Klabin");
    var cs=consumo(id); if(cs&&cs.aut!=null&&cs.aut<S.cfg.autMin) add(id+":aut",pt.nome,"Autonomia do tanque ≈ "+fmt(cs.aut,0)+" dias ("+fmt(cs.c,1)+" L/dia)","Programar reposição de "+(p.produto?p.produto.toLowerCase():"produto"),"a","Ecolab");
  });
  L2.sort(function(x,y){ if(x.feito!==y.feito) return x.feito?1:-1; return x.pr===y.pr?0:(x.pr==="a"?-1:1); });
  return L2;
}

/* ---------- conformidade mensal ---------- */
var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function conformMensal(incluiAtual){
  var m={};
  function acc(data,sts){ var k=data.slice(0,7); m[k]=m[k]||{n:0,ok:0,warn:0}; m[k].n++; sts.forEach(function(st){ if(st==="ok") m[k].ok++; if(st==="warn") m[k].warn++; }); }
  H.forEach(function(e){ if(incluiAtual&&e.data===S.cab.data) return; acc(e.data,PONTOS.map(function(pt){ return e.pts[pt.id]?e.pts[pt.id].st:"pend"; })); });
  if(incluiAtual){ var st=PONTOS.map(function(pt){ return avaliaPonto(pt.id).st; }); if(st.some(function(x){return x==="ok"||x==="warn";})) acc(S.cab.data||hoje(),st); }
  return Object.keys(m).sort().map(function(k){ var o=m[k], t=o.ok+o.warn; return {mes:k,rot:MESES[+k.slice(5,7)-1]+"/"+k.slice(0,4),n:o.n,ok:o.ok,warn:o.warn,pct:t?o.ok/t*100:null}; });
}

function valorHist(pts,id,k,fat){ var q=pts[id]; if(!q||q.skip) return null;

  if(k==="fos"){ var t=num(q.fosT); return t!=null?t/(fat||fator()):num(q.fosP); } return null; }

function limTrend(id,k){ var lo=num(L[id][k+"Min"]), hi=num(L[id][k+"Max"]); if(k==="fos"){ var f=fator(); lo=lo!=null?lo/f:null; hi=hi!=null?hi/f:null; } return [lo,hi]; }
function trendSVG(serie,lo,hi,casas,W,Hh){
  if(serie.length<2) return '<svg viewBox="0 0 '+W+' '+Hh+'"><text x="'+(W/2)+'" y="'+(Hh/2+4)+'" text-anchor="middle" font-size="11" fill="#5B6878">sem histórico suficiente</text></svg>';
  var vs=serie.map(function(o){return o.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(lo!=null) mn=Math.min(mn,lo); if(hi!=null) mx=Math.max(mx,hi); var pad=(mx-mn)*0.12||Math.abs(mx)*0.05||1; mn-=pad; mx+=pad;
  var x0=6, x1=W-44, y0=6, y1=Hh-16;
  function X(i){ return x0+(serie.length===1?0:i/(serie.length-1))*(x1-x0); } function Y(v){ return y1-(v-mn)/(mx-mn)*(y1-y0); }
  var g='<svg viewBox="0 0 '+W+' '+Hh+'" role="img">';

  g+='<polyline fill="none" stroke="#0060A9" stroke-width="2" stroke-linejoin="round" points="'+serie.map(function(o,i){ return X(i).toFixed(1)+","+Y(o.v).toFixed(1); }).join(" ")+'"/>';
  serie.forEach(function(o,i){ var out=(lo!=null&&o.v<lo)||(hi!=null&&o.v>hi); g+='<circle cx="'+X(i)+'" cy="'+Y(o.v)+'" r="'+(o.atual?4:3)+'" fill="'+(out?"#C5221F":"#0060A9")+'" stroke="#fff" stroke-width="1.5"><title>'+dataBR(o.data)+': '+fmt(o.v,casas)+'</title></circle>'; });
  var ult=serie[serie.length-1], uo=(lo!=null&&ult.v<lo)||(hi!=null&&ult.v>hi);
  g+='<text x="'+(x1+6)+'" y="'+(Y(ult.v)+4)+'" font-size="11" font-weight="700" fill="'+(uo?"#C5221F":"#1A2330")+'">'+fmt(ult.v,casas)+'</text>';
  g+='<text x="'+x0+'" y="'+(Hh-3)+'" font-size="9" fill="#5B6878">'+dataBR(serie[0].data).slice(0,5)+'</text>';
  g+='<text x="'+x1+'" y="'+(Hh-3)+'" font-size="9" fill="#5B6878" text-anchor="end">'+dataBR(ult.data).slice(0,5)+'</text>';
  return g+'</svg>';
}

function baixar(nome,conteudo,tipo){ var bl=new Blob([conteudo],{type:tipo}), a=document.createElement("a"); a.href=URL.createObjectURL(bl); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function fazBackup(){
  var fotos={}; todasFotos().forEach(function(f){ if(f.id&&FOTOS[f.id]) fotos[f.id]=FOTOS[f.id]; });
  baixar("backup_inspecao_puma_"+(S.cab.data||hoje())+".json",JSON.stringify({app:"inspecao-puma",ver:1,criado:new Date().toISOString(),S:S,L:L,H:H,A:A,fotos:fotos}),"application/json");
  toast("Backup salvo em Downloads",3000);
}
function restauraBackup(txt){
  var d; try{ d=JSON.parse(txt); }catch(e){ toast("Arquivo inválido",3000); return; }
  if(!d||d.app!=="inspecao-puma"||!d.S){ toast("Este arquivo não é um backup do app",3500); return; }
  if(!confirm("Restaurar o backup de "+(d.criado||"").slice(0,10).split("-").reverse().join("/")+"?\n\nA inspeção atual, o histórico e os limites deste aparelho serão substituídos.")) return;
  S=d.S; L=d.L||L; H=d.H||[]; A=d.A||[]; FOTOS=d.fotos||{};
  idbClear().then(function(){ Object.keys(FOTOS).forEach(function(id){ idbPut(id,FOTOS[id]); }); });
  saveNow(); saveLim(); saveHist(); saveA(); render(); toast("Backup restaurado ✔",3000);
}
function exportaCSV(){
  var cols=["Data","Inspetor","Ponto","Status","pH Trasar","pH Portátil","Cond Trasar","Cond Portátil","Tinta TRASAR","PO4 calc","PO4 Lab","Produto","Dosagem","Vazão L/h","Pressão","Nível L","Abastecido L","Consumo L/dia","Autonomia dias","Vazamento","Ajuste Trasar","Obs"];
  var linhas=[cols.join(";")];
  var LB={operando:"Operando",parada:"Parada",sim:"Sim",nao:"Não"};
  histOrd().forEach(function(e){ PONTOS.forEach(function(pt){ var q=e.pts[pt.id]; if(!q||q.st==="pend") return; var t=num(q.fosT);
    var row=[dataBR(e.data),e.inspetor,pt.nome,{ok:"Conforme",warn:"Atenção",skip:"Não inspecionado",pend:"Sem dados"}[q.st]||"",q.phT,q.phP,q.condT,q.condP,q.fosT,t!=null?fmt(t/(e.fator||fator()),2):"",q.fosP,q.produto,LB[q.dosagem]||q.dosagem,q.vazao,q.pressao,q.nivel,q.abast,
      q.cons!=null?fmt(q.cons,1):"",q.aut!=null?fmt(q.aut,0):"",LB[q.vazamento]||q.vazamento,q.ajuste==="sim"?"Sim"+(q.ajObs?" – "+q.ajObs:""):"",q.obs];
    linhas.push(row.map(function(x){ x=x==null?"":String(x); return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(";")); }); });
  baixar("historico_inspecao_puma.csv","﻿"+linhas.join("\r\n"),"text/csv");
}
function exportaLimites(){
  var agora=new Date(), ver=hoje()+" "+("0"+agora.getHours()).slice(-2)+":"+("0"+agora.getMinutes()).slice(-2);
  var d={versao:ver,ref:L._ref,pontos:{}};
  PONTOS.forEach(function(pt){ var o={}; PARAMS.forEach(function(q){ o[q.k+"Min"]=L[pt.id][q.k+"Min"]; o[q.k+"Max"]=L[pt.id][q.k+"Max"]; }); o.semAnalise=!!L[pt.id].semAnalise; o.semDosagem=!!L[pt.id].semDosagem; d.pontos[pt.id]=o; });
  L._versao=ver; saveLim(); baixar("limites.json",JSON.stringify(d,null,2),"application/json");
  toast("limites.json salvo — suba no GitHub para atualizar todos os celulares",4500);
}
function carregaLimitesServidor(){
  if(location.protocol.indexOf("http")!==0||!window.fetch) return;
  fetch("limites.json",{cache:"no-cache"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d||!d.pontos||!d.versao||L._versao===d.versao) return;
    var b=limitesPadrao(); PONTOS.forEach(function(pt){ L[pt.id]=Object.assign(b[pt.id],d.pontos[pt.id]||{}); });
    if(d.ref) L._ref=d.ref; L._versao=d.versao; saveLim(); render(); toast("Limites de controle atualizados ("+d.versao+")",3500);
  }).catch(function(){});
}
function resumoTexto(){
  var st=contaStatus(), pa=planoAcao(), t=[];
  t.push("*Inspeção Tratamento de Água – Klabin Puma*"); t.push("Data: "+dataBR(S.cab.data)+(S.cab.inspetor?" · Inspetor: "+S.cab.inspetor:""));
  t.push("✅ "+st.ok+" conforme(s) · ⚠️ "+st.warn+" com atenção"+(st.skip?" · ➖ "+st.skip+" não inspecionado(s)":""));
  var ab=pa.filter(function(x){return !x.feito;}), fe=pa.filter(function(x){return x.feito;});
  if(ab.length){ t.push(""); t.push("*Ocorrências e ações:*"); ab.forEach(function(x){ t.push("• "+x.pt+": "+x.oc+" → "+x.acao+" ("+x.resp+(x.prazo?", até "+dataBR(x.prazo):"")+")"); }); }
  if(fe.length){ t.push(""); t.push("*Realizado em campo:*"); fe.forEach(function(x){ t.push("• "+x.pt+": "+x.acao); }); }
  if(!ab.length&&!fe.length){ t.push(""); t.push("Todos os pontos inspecionados estão conformes."); }
  var pend=A.filter(function(a){ return S.follow[a.id]!=="resolvida"; }); if(pend.length){ t.push(""); t.push("*Ações anteriores ainda abertas:* "+pend.length); }
  t.push(""); t.push("Relatório completo em PDF a seguir."); return t.join("\n");
}
function compartilhaResumo(){ var tx=resumoTexto();

function montaRelatorio(){
  var m=S.med, rm=avaliaMedidor(), h='';
  var stats={ok:0,warn:0,pend:0,skip:0}; PONTOS.forEach(function(pt){ stats[avaliaPonto(pt.id).st]++; });
  var insp=stats.ok+stats.warn;

  /* ===== Página 1: resumo ===== */
  h+='<div class="r-head"><div style="text-align:left"><h1>Relatório de Inspeção – Tratamento de Água</h1>Klabin · Unidade Puma · Ecolab / Nalco Water</div>'
    +'<div><b>Data:</b> '+esc(dataBR(S.cab.data))+'<br><b>Inspetor:</b> '+v(S.cab.inspetor)+'</div></div>';
  h+='<div class="kpis">'
    +'<div class="kpi"><small>Pontos inspecionados</small><b>'+insp+'<span> de '+PONTOS.length+'</span></b><span>'+(stats.skip?stats.skip+' não inspecionado(s)':'todos os pontos')+'</span></div>'
    +'<div class="kpi"><small>Conformes</small><b><span class="ic ic-ok">✔</span>'+stats.ok+'</b><span>dentro das faixas e tolerâncias</span></div>'
    +'<div class="kpi"><small>Com atenção</small><b><span class="ic ic-warn">⚠</span>'+stats.warn+'</b><span>ver plano de ação</span></div>'
    +'<div class="kpi"><small>Medidor portátil</small><b style="font-size:13pt;padding:5px 0 3px"><span class="ic '+(rm.st==="ok"?"ic-ok":rm.st==="warn"?"ic-warn":"ic-pend")+'">'+(rm.st==="ok"?"✔":rm.st==="warn"?"⚠":"–")+'</span>'+(rm.st==="ok"?"Verificado":rm.st==="warn"?"Com pendência":"Não verificado")+'</b><span>'+(m.calib?'calibrado em '+esc(dataBR(m.calib)):'')+'</span></div>'
    +'</div>';
  var cmm=conformMensal(true), cur=cmm.filter(function(x){ return x.mes===(S.cab.data||hoje()).slice(0,7); })[0];
  if(cur&&cur.pct!=null){ var cc=cur.pct>=90?"#1E8E3E":cur.pct>=70?"#C98A00":"#C5221F";
    h+='<div class="cm1">Conformidade em <b>'+cur.rot+'</b>: <span class="bar"><i style="width:'+cur.pct.toFixed(0)+'%;background:'+cc+'"></i></span><b>'+fmt(cur.pct,0)+'%</b> dos pontos inspecionados conformes · '+cur.n+' inspeç'+(cur.n>1?'ões':'ão')+' no mês'
      +(cmm.length>1?' · mês anterior: '+(cmm[cmm.length-2].pct!=null?fmt(cmm[cmm.length-2].pct,0)+'%':'–'):'')+'</div>'; }

  h+='<div class="r-sec">Mapa de status</div><div class="mapa">';
  PONTOS.forEach(function(pt){
    var p=S.pts[pt.id], r=avaliaPonto(pt.id), cls=r.st==="ok"?"ok":r.st==="warn"?"warn":"";
    var st=r.st==="ok"?'<span class="st">✔ Conforme</span>':r.st==="warn"?'<span class="st">⚠ '+r.issues.length+' ocorrência'+(r.issues.length>1?'s':'')+'</span>':'<span class="st n">'+(r.st==="skip"?'— Não inspecionado':'Pendente')+'</span>';
    var dados=p.skip?'':[p.phP||p.phT?'pH '+(p.phP||p.phT):'', pt.dose&&po4Calc(p)!=null?'PO₄ '+fmt(po4Calc(p),2):''].filter(Boolean).join(' · ');
    h+='<div class="mt '+cls+'"><b>'+esc(pt.nome.replace("Trasar ",""))+'</b>'+st+(dados?'<br>'+dados:'')+'</div>';
  });
  h+='</div>';

  var pa=planoAcao();
  h+='<div class="r-sec">Plano de ação</div>';
  if(pa.length){
    h+='<table class="acao"><tr><th style="width:15%">Ponto</th><th style="width:30%">Ocorrência</th><th>Ação</th><th style="width:8%">Resp.</th><th style="width:9%">Prazo</th><th style="width:9%">Prioridade</th></tr>';
    pa.forEach(function(x){ h+='<tr><td><b>'+esc(x.pt)+'</b></td><td>'+esc(x.oc)+'</td><td>'+esc(x.acao)+'</td><td>'+esc(x.resp)+'</td><td>'+(x.feito?'—':(x.prazo?dataBR(x.prazo):'a definir'))+'</td><td><span class="prio '+(x.feito?'f':x.pr)+'">'+(x.feito?'✔ Realizado':x.pr==="a"?"Alta":"Média")+'</span></td></tr>'; });
    h+='</table>';
  } else h+='<p>Nenhuma ocorrência. Todos os pontos inspecionados estão conformes.</p>';
  if(A.length){
    h+='<div class="r-sec">Acompanhamento de ações anteriores</div><table class="acao"><tr><th style="width:10%">Aberta em</th><th style="width:15%">Ponto</th><th>Ação</th><th style="width:8%">Resp.</th><th style="width:9%">Prazo</th><th style="width:13%">Situação</th></tr>';
    A.forEach(function(a){ var si=situacaoAcao(a);
      var sit=si.st==="resolvida"?'<span class="prio f">✔ Resolvida</span>':si.atras?'<span class="atr">⚠ Atrasada</span>':si.st==="pendente"?'<span class="prio m">⏳ Pendente</span>':'<span style="color:#5B6878">Não verificada</span>';
      h+='<tr><td>'+dataBR(a.origem)+'</td><td><b>'+esc(a.pt)+'</b></td><td>'+esc(a.acao)+'</td><td>'+esc(a.resp||"")+'</td><td>'+(a.prazo?dataBR(a.prazo):'—')+'</td><td>'+sit+'</td></tr>'; });
    h+='</table>';
  }
  if(S.cab.obs) h+='<div class="r-sec">Observações gerais</div><p style="font-size:9.5pt">'+esc(S.cab.obs)+'</p>';

  /* ===== Visão por ponto ===== */
  h+='<div class="r-sec pb">Resultados por ponto</div>';
  h+='<div class="leg"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="'+INK+'"/></svg> Trasar</span>'

    +'<span><svg width="26" height="12"><rect x="1" y="2" width="24" height="8" rx="2" fill="#BFE3CB" stroke="#3E9A60"/></svg> Faixa de controle</span>'

    var p=S.pts[pt.id], r=avaliaPonto(pt.id), cls=r.st==="ok"?"ok":r.st==="warn"?"warn":"";

    if(pt.dose){
      var f=fator(), lo=num(L[pt.id].fosMin), hi=num(L[pt.id].fosMax), fo=cmpFos(p);
      h+=linhaRegua("PO₄","ppm",lo!=null?lo/f:null,hi!=null?hi/f:null,po4Calc(p),num(p.fosP),["T","Lab"],fo?{ok:fo.ok,txt:fmt(fo.d,2)+" ppm"}:null);
    }
    }
    var dz=[];
    if(p.produto) dz.push('<b>'+esc(p.produto)+'</b>');

  });
  h+='</div>';

  /* ===== Tendência ===== */
  if(histAntes().length){
    var temT=false, th='';
    PONTOS.forEach(function(pt){ var p=S.pts[pt.id]; if(L[pt.id].semAnalise) return;
      var row='<tr><td class="n">'+esc(pt.nome)+'</td>', temR=false;

  if(m.obs) h+='<p style="font-size:9pt"><b>Obs.:</b> '+esc(m.obs)+'</p>';
  h+=anexoTabela();
  h+='<div class="r-sign"><div>'+v(S.cab.inspetor)+'<br>Ecolab / Nalco Water</div><div>Responsável Klabin</div></div>';
  $("#report").innerHTML=h;
}
